[Metadata]
Name=Maatra Dark
Version=3
Author=Maatra
Description=Maatra — Marathi transliteration candidate theme (dark, compact)
ScaleWithDPI=True

[InputPanel]
NormalColor=#dce0f0
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#7c5cff
# Make the selection bar span the whole width of the popup (full left-to-right),
# instead of hugging only the candidate text.
FullWidthHighlight=True
# The addon pads rows to equal width at the candidate font size.
CommentTextSizeFactor=100

# Keep equal to [InputPanel/Highlight/Margin] on every side. If they differ, the
# pill stops matching its row and the padding looks uneven.
[InputPanel/TextMargin]
Left=7
Right=7
Top=7
Bottom=7

# Includes the transparent shadow area around the panel (see ShadowMargin).
[InputPanel/ContentMargin]
Left=17
Right=17
Top=17
Bottom=17

# panel.png and highlight.png come from ../generate-maatra-dark.py. Margin says
# how much of each image edge stays unstretched, which is what keeps the rounded
# corners crisp at any popup size.
[InputPanel/Background]
Image=panel.png

[InputPanel/Background/Margin]
Left=24
Right=24
Top=24
Bottom=24

# Clicks and window placement ignore this transparent shadow area.
[InputPanel/ShadowMargin]
Left=12
Right=12
Top=12
Bottom=12

[InputPanel/Highlight]
Image=highlight.png

[InputPanel/Highlight/Margin]
Left=7
Right=7
Top=7
Bottom=7

# No PrevPage/NextPage images: the list scrolls, and page arrows would widen the
# popup whenever they appeared. Fcitx5 reserves no space for them without images.

[Menu]
NormalColor=#dce0f0
HighlightCandidateColor=#ffffff

[Menu/Background]
Color=#1e1e2e
BorderColor=#45475a
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Color=#7c5cff

[Menu/Highlight/Margin]
Left=6
Right=6
Top=5
Bottom=5

[Menu/Separator]
Color=#45475a

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=6
Right=6
Top=5
Bottom=5
