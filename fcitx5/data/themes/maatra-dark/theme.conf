[Metadata]
Name=Maatra Dark
Version=1
Author=Maatra
Description=Maatra — Marathi transliteration candidate theme (dark, roomy)
ScaleWithDPI=True

[InputPanel]
NormalColor=#dce0f0
HighlightCandidateColor=#ffffff
HighlightColor=#ffffff
HighlightBackgroundColor=#7c5cff
# Make the selection bar span the whole width of the popup (full left-to-right),
# instead of hugging only the candidate text.
FullWidthHighlight=True
PageButtonAlignment=Last Candidate

[InputPanel/TextMargin]
Left=12
Right=12
Top=9
Bottom=9

[InputPanel/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[InputPanel/Background]
Color=#1e1e2e
BorderColor=#45475a
BorderWidth=1

[InputPanel/Background/Margin]
Left=4
Right=4
Top=4
Bottom=4

[InputPanel/Highlight]
Color=#7c5cff

[InputPanel/Highlight/Margin]
Left=8
Right=8
Top=6
Bottom=6

[InputPanel/PrevPage]
Image=prev.png

[InputPanel/PrevPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[InputPanel/NextPage]
Image=next.png

[InputPanel/NextPage/ClickMargin]
Left=5
Right=5
Top=4
Bottom=4

[Menu]
NormalColor=#dce0f0
HighlightCandidateColor=#ffffff

[Menu/Background]
Color=#1e1e2e
BorderColor=#45475a
BorderWidth=1

[Menu/Background/Margin]
Left=2
Right=2
Top=2
Bottom=2

[Menu/ContentMargin]
Left=4
Right=4
Top=4
Bottom=4

[Menu/Highlight]
Color=#7c5cff

[Menu/Highlight/Margin]
Left=6
Right=6
Top=5
Bottom=5

[Menu/Separator]
Color=#45475a

[Menu/CheckBox]
